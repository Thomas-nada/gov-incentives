  <meta name="theme-color" content="#4f46e5" />
  <meta property="og:title" content="Cardano Governance Rewards" />
  <meta property="og:description" content="Check your eligibility and claim your equal share of the governance reward pool." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M12 5 6.5 7.4v4.1c0 3.2 2.2 5.8 5.5 7.3 3.3-1.5 5.5-4.1 5.5-7.3V7.4L12 5Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='m9.7 12 1.6 1.6 3-3.1' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
    // Apply the stored theme before first paint to avoid a light flash.
    try {
      var t = localStorage.getItem('govrewards.theme.v1');
      var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">

  <div id="env-banner" class="env-banner"></div>

  <header id="nav" class="sticky top-0 z-40"></header>

  <main id="app" class="flex-1"></main>

  <footer id="footer" class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950"></footer>

  <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
